# 全自动部署：构建网站并推送到 gh-pages 分支（GitHub Pages 自动发布）
# 触发：推送到开发分支 或 手动运行
# 说明：VITE_* 均为前端公开配置（anon key 本来就会打进浏览器端产物），非机密
name: Deploy site to GitHub Pages

on:
  push:
    branches: [claude/culture-agent-media-gen-v998j7]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-c2zk70llophd
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app-c2zk70llophd/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build (Vite)
        run: npx vite build --base=/-/
        env:
          VITE_SUPABASE_URL: https://backend.appmiaoda.com/projects/supabase320478069733244928
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJhdXRoZW50aWNhdGVkIiwiZXhwIjoyMDk1ODM1MTI2LCJpc3MiOiJzdXBhYmFzZSIsInJvbGUiOiJhbm9uIiwic3ViIjoiYW5vbiJ9.iKorflFSe7jdx_50T14hKpAZ1oSn0JQb8W_pduqpLOs
          VITE_APP_ID: app-c2zk70llophd
      - name: Deploy to gh-pages branch
        run: |
          cd dist
          cp index.html 404.html
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
