# 全自动部署：构建网站并推送到 gh-pages 分支（GitHub Pages 自动发布）
# 触发：推送到开发分支 或 手动运行
# 说明：VITE_* 均为前端公开配置（anon key 本来就会打进浏览器端产物），非机密
name: Deploy site to GitHub Pages

on:
  push:
    branches: [claude/culture-agent-media-gen-v998j7]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-c2zk70llophd
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app-c2zk70llophd/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build (Vite)
        run: npx vite build --base=/-/
        env:
          VITE_SUPABASE_URL: https://backend.appmiaoda.com/projects/supabase320478069733244928
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJhdXRoZW50aWNhdGVkIiwiZXhwIjoyMDk1ODM1MTI2LCJpc3MiOiJzdXBhYmFzZSIsInJvbGUiOiJhbm9uIiwic3ViIjoiYW5vbiJ9.iKorflFSe7jdx_50T14hKpAZ1oSn0JQb8W_pduqpLOs
          VITE_APP_ID: app-c2zk70llophd
      - name: Deploy to gh-pages branch
        run: |
          cd dist
          cp index.html 404.html
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 大陆直连版：hash 路由构建 → 上传到站点自己的 Supabase 公开存储桶（百度云，大陆可直接访问）──
      # 桶策略为"匿名可新增、不可覆盖"，故每次部署用带 run_number 的新目录，文件不可被篡改
      - name: Build (China mirror, hash router)
        run: npx vite build --base=./ --outDir dist-cn
        env:
          VITE_SUPABASE_URL: https://backend.appmiaoda.com/projects/supabase320478069733244928
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJhdXRoZW50aWNhdGVkIiwiZXhwIjoyMDk1ODM1MTI2LCJpc3MiOiJzdXBhYmFzZSIsInJvbGUiOiJhbm9uIiwic3ViIjoiYW5vbiJ9.iKorflFSe7jdx_50T14hKpAZ1oSn0JQb8W_pduqpLOs
          VITE_APP_ID: app-c2zk70llophd
          VITE_ROUTER_MODE: hash
      - name: Upload China mirror to Supabase Storage
        run: |
          SUPABASE_URL="https://backend.appmiaoda.com/projects/supabase320478069733244928"
          ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJhdXRoZW50aWNhdGVkIiwiZXhwIjoyMDk1ODM1MTI2LCJpc3MiOiJzdXBhYmFzZSIsInJvbGUiOiJhbm9uIiwic3ViIjoiYW5vbiJ9.iKorflFSe7jdx_50T14hKpAZ1oSn0JQb8W_pduqpLOs"
          DEST="site-r${{ github.run_number }}"
          cd dist-cn
          fail=0
          while IFS= read -r -d '' f; do
            rel="${f#./}"
            case "$rel" in
              *.html) ct="text/html; charset=utf-8" ;;
              *.js)   ct="text/javascript; charset=utf-8" ;;
              *.css)  ct="text/css; charset=utf-8" ;;
              *.svg)  ct="image/svg+xml" ;;
              *.png)  ct="image/png" ;;
              *.ico)  ct="image/x-icon" ;;
              *.json) ct="application/json" ;;
              *)      ct="application/octet-stream" ;;
            esac
            code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
              "$SUPABASE_URL/storage/v1/object/generated-audio/$DEST/$rel" \
              -H "Authorization: Bearer $ANON" -H "apikey: $ANON" \
              -H "Content-Type: $ct" --data-binary "@$f")
            echo "$code  $rel"
            [ "$code" = "200" ] || fail=1
          done < <(find . -type f -print0)
          URL="$SUPABASE_URL/storage/v1/object/public/generated-audio/$DEST/index.html"
          echo "## 🇨🇳 大陆直连网址" >> $GITHUB_STEP_SUMMARY
          echo "$URL" >> $GITHUB_STEP_SUMMARY
          echo "CHINA_URL=$URL"
          exit $fail
